name: Android Release APK

# Build a release APK whenever a version tag is pushed, and attach it to the
# matching GitHub Release. The build runs entirely on the runner (Expo
# Continuous Native Generation + Gradle) — no Expo account or EAS needed.
#
# Push a tag to trigger it, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Signing: if the repo has the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
# / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets set, the APK is signed with
# that upload keystore. Otherwise it falls back to the Android debug keystore so
# the artifact still installs (fine for internal testing, not for the Play Store).

on:
  push:
    tags:
      - 'v*'

# Needed so the workflow can create the GitHub Release and upload the APK.
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Generate the native Android project
        # android/ is gitignored (Continuous Native Generation), so regenerate
        # it from app.json and the config plugins on every build.
        run: npx expo prebuild --platform android --no-install

      - name: Decode the release keystore (if provided)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release keystore secret set; the release build will use the debug keystore."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK (signed with the upload keystore)
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Build release APK (debug-signed fallback)
        if: steps.keystore.outputs.present == 'false'
        working-directory: android
        # Expo prebuild's generated app/build.gradle already signs the release
        # build type with the debug keystore (the RN template default), so the
        # APK is signed and installable without any secrets. Good for internal
        # testing; use a real keystore (secrets above) for the Play Store.
        run: ./gradlew assembleRelease

      - name: Locate the built APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found." >&2
            exit 1
          fi
          # Give the artifact a versioned name: seam-<tag>.apk
          DEST="seam-${GITHUB_REF_NAME}.apk"
          cp "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: seam-${{ github.ref_name }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach the APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          name: Seam ${{ github.ref_name }}
          generate_release_notes: true
